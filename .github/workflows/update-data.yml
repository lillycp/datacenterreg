name: Update data center regulation data

on:
  schedule:
    # 13:00 UTC daily
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Diagnose Congress.gov access (temporary)
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
        run: |
          echo "--- curl test ---"
          curl -s -o /tmp/curl_body.txt -w "HTTP status: %{http_code}\n" "https://api.congress.gov/v3/bill/119/hr?api_key=${CONGRESS_API_KEY}&format=json&limit=1"
          echo "--- body (first 500 chars) ---"
          head -c 500 /tmp/curl_body.txt

      - name: Fetch fresh data
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
        run: python3 scripts/fetch_data.py

      - name: Commit updated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/regulations.json data/opposition.json data/meta.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Daily data refresh"
            git push
          fi
