name: Update data center regulation data

on:
  schedule:
    # 13:00 UTC daily
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          # Full history, not the default shallow single-commit checkout —
          # the retry-with-rebase step below needs real ancestry to rebase
          # onto origin/main if it's moved since checkout.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch fresh data
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
        run: python3 scripts/fetch_data.py

      - name: Commit updated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/regulations.json data/opposition.json data/meta.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Daily data refresh"

          # main can move between checkout and push (e.g. a manual push
          # landing mid-run), which git correctly rejects as non-fast-forward.
          # Since these three files are always fully machine-regenerated from
          # the seed/excluded source-of-truth files plus live API results,
          # retry by rebasing onto the new tip; if that itself conflicts,
          # our freshly generated data wins outright rather than leaving the
          # run stuck, and the very next run reconciles anything transient.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5), rebasing onto latest origin/main..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase conflict on generated data; keeping our regenerated version."
              git rebase --abort
              git reset --soft origin/main
              git add data/regulations.json data/opposition.json data/meta.json
              git commit -m "Daily data refresh"
            fi
            sleep $((RANDOM % 5 + 1))
          done
          echo "Failed to push after 5 attempts."
          exit 1
